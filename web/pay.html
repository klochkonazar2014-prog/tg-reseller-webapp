<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OctoRent | Оплата</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #5865F2;
            --bg: #050505;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .order-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .amount-display {
            text-align: center;
            margin-bottom: 32px;
        }

        .amount-value {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .currency {
            font-size: 24px;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .order-details {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
        }

        .pay-methods-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .btn-pay {
            width: 100%;
            height: 64px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        .btn-pay:active { transform: scale(0.98); }

        .card-icons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
            opacity: 0.6;
        }

        .card-icon {
            height: 20px;
            filter: grayscale(1) invert(1);
        }

        .secure-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="header">
            <div class="logo">OCTORENT</div>
            <div style="font-size: 14px; color: var(--text-muted);">Secure Checkout</div>
        </div>
        <div class="order-card">
            <div class="amount-display">
                <span class="amount-value" id="disp-amount">0</span>
                <span class="currency">RUB</span>
            </div>
            <div class="order-details">
                <div class="detail-row">
                    <span class="detail-label">Заказ</span>
                    <span class="detail-value" id="disp-order">#000000</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Услуга</span>
                    <span class="detail-value">Аренда цифрового лота</span>
                </div>
            </div>
        </div>
        <p class="pay-methods-title">Метод оплаты: Карта РФ</p>
        <button class="btn-pay" onclick="proceedToPayment()">
            <div class="loader" id="btn-loader"></div>
            <span id="btn-text">Оплатить</span>
        </button>
        <div class="card-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Mir-logo.svg" class="card-icon" alt="MIR">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" class="card-icon" alt="VISA">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" class="card-icon" alt="MasterCard">
        </div>
        <div class="secure-footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v5.7c0 4.66-3.2 9.03-7 10.12-3.8-1.09-7-5.46-7-10.12v-5.7l7-3.12z"/>
            </svg>
            Защищено PCI DSS OctoRent
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '0';
        const orderId = urlParams.get('order_id') || '0';

        document.getElementById('disp-amount').textContent = parseFloat(amount).toFixed(2);
        document.getElementById('disp-order').textContent = '#' + orderId;

        function proceedToPayment() {
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('btn-loader');
            btnText.style.display = 'none';
            loader.style.display = 'block';

            // ПОБЕДНЫЙ ХОД: Прямой редирект (замени 1484992 на свой ID если он другой)
            const streamerUrl = `https://new.donatepay.ru/@1484992?amount=${amount}&message=${orderId}`;
            
            setTimeout(() => {
                window.location.href = streamerUrl;
            }, 600);
        }
    </script>
</body>
</html>
