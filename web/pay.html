<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OctoRent | Система Оплаты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0d0e14; /* Цвет совпадает с тем, что мы ставим в DonatePay */
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 242, 254, 0.3);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            margin-bottom: 25px;
        }

        .payment-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0, 242, 254, 0.1);
            position: relative;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .info-block { text-align: left; }
        .info-block.right { text-align: right; }
        .label { color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value { font-weight: 700; font-size: 20px; font-family: 'Orbitron', sans-serif; }

        /* Окно для виджета */
        .widget-area {
            width: 100%;
            min-height: 180px;
            background: transparent;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: none;
            background: transparent;
        }

        .secure-badge {
            margin-top: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 242, 254, 0.1);
            border-radius: 100px;
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">OCTORENT</div>

        <div class="payment-card">
            <div class="header-info">
                <div class="info-block">
                    <p class="label">Сумма</p>
                    <p class="value" id="val-sum">0.00</p>
                </div>
                <div class="info-block right">
                    <p class="label">Заказ</p>
                    <p class="value" id="val-order">#000</p>
                </div>
            </div>

            <div class="widget-area">
                <div id="iframe-target"></div>
            </div>

            <div class="secure-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.14-2.8 7.9-6 8.91-3.2-1.01-6-4.77-6-8.91V6.43l6-2.25z"/>
                </svg>
                Secure SSL Connection
            </div>
        </div>

        <p class="footer-text">
            Нажимая «Оплатить», вы подтверждаете согласие с условиями предоставления услуг. Ваши данные защищены по стандарту PCI DSS.
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '1.00';
        const orderId = urlParams.get('order_id') || '0';

        document.getElementById('val-sum').textContent = parseFloat(amount).toFixed(2) + ' RUB';
        document.getElementById('val-order').textContent = '#' + orderId;

        // Твой ID пользователя в DonatePay
        const USER_ID = "1484992";
        
        // URL страницы пожертвований (не виджета!)
        const url = `https://donatepay.ru/pay/${USER_ID}?sum=${amount}&comment=${orderId}`;

        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.allow = "payment";
        document.getElementById('iframe-target').appendChild(iframe);
    </script>
</body>
</html>
