<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OctoRent — Отзывы</title>
    <meta name="description" content="Отзывы пользователей сервиса аренды NFT OctoRent">
    <script src="https://telegram.org/js/telegram-web-app.js?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #0088cc;
            --accent-blue-hover: #1c93e1;
            --bg-dark: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overscroll-behavior: none;
        }

        /* HEADER */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 14, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .page-header-logo {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #0098EA, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .page-header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 600;
        }

        .stat-stars {
            color: #FFD700;
            font-size: 14px;
            margin-top: 2px;
        }

        /* REVIEWS LIST */
        .reviews-container {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--card-border);
            transition: border-color 0.2s;
            animation: fadeInUp 0.3s ease both;
        }

        .review-card:hover {
            border-color: rgba(0, 136, 204, 0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .review-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0088cc, #005599);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .review-meta {
            flex: 1;
            min-width: 0;
        }

        .review-username {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .review-nft {
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 600;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .review-stars {
            color: #FFD700;
            font-size: 13px;
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .review-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.55;
            word-break: break-word;
        }

        .review-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state-desc {
            font-size: 14px;
            line-height: 1.5;
        }

        /* LOADING */
        .loader-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* SCROLL TO TOP */
        .scroll-top-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 136, 204, 0.4);
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            border: none;
        }

        .scroll-top-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .scroll-top-btn:active {
            transform: scale(0.9);
        }

        /* VERIFIED BADGE */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #00d488;
            background: rgba(0, 212, 136, 0.1);
            border: 1px solid rgba(0, 212, 136, 0.25);
            padding: 3px 7px;
            border-radius: 6px;
            margin-left: 6px;
        }

        /* LOAD MORE */
        .load-more-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .load-more-btn:active {
            background: rgba(0, 136, 204, 0.1);
            border-color: rgba(0, 136, 204, 0.3);
        }

        /* Bottom spacer */
        .bottom-spacer { height: 40px; }
    </style>
</head>
<body>

    <div class="page-header">
        <div>
            <div class="page-header-logo">🐙 OctoRent</div>
            <div class="page-header-subtitle">Отзывы пользователей</div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar" style="display:none;">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Отзывов</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-rating">5.0</div>
            <div class="stat-stars">⭐⭐⭐⭐⭐</div>
            <div class="stat-label">Средний рейтинг</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-verified">0</div>
            <div class="stat-label">Верифицированных</div>
        </div>
    </div>

    <!-- Reviews -->
    <div class="reviews-container" id="reviews-container">
        <div class="loader-wrap"><div class="spinner"></div></div>
    </div>

    <div class="bottom-spacer"></div>

    <button class="scroll-top-btn" id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

        // --- Scroll to top button ---
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('scroll-top-btn');
            if (btn) btn.classList.toggle('visible', window.scrollY > 300);
        });

        // --- Helpers ---
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name[0].toUpperCase();
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            } catch { return ''; }
        }

        function renderStars(rating) {
            const r = Math.max(1, Math.min(5, parseInt(rating) || 5));
            return '⭐'.repeat(r);
        }

        function hashColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const colors = [
                'linear-gradient(135deg,#0088cc,#005599)',
                'linear-gradient(135deg,#7c3aed,#4f1dc4)',
                'linear-gradient(135deg,#059669,#047857)',
                'linear-gradient(135deg,#d97706,#b45309)',
                'linear-gradient(135deg,#dc2626,#991b1b)',
                'linear-gradient(135deg,#0891b2,#0e7490)',
            ];
            return colors[Math.abs(hash) % colors.length];
        }

        // --- Render Review Card ---
        let animDelay = 0;
        function renderReview(review) {
            const name = review.username || review.full_name || `Пользователь`;
            const initials = getInitials(name);
            const bg = hashColor(String(review.user_id || name));
            const card = document.createElement('div');
            card.className = 'review-card';
            card.style.animationDelay = `${animDelay}ms`;
            animDelay = Math.min(animDelay + 60, 400);

            card.innerHTML = `
                <div class="review-header">
                    <div class="review-avatar" style="background: ${bg}">${initials}</div>
                    <div class="review-meta">
                        <div class="review-username">
                            ${name}
                            <span class="verified-badge">✓ Арендовал</span>
                        </div>
                        ${review.nft_name ? `<div class="review-nft">🎁 ${review.nft_name}</div>` : ''}
                    </div>
                    <div class="review-stars">${renderStars(review.rating)}</div>
                </div>
                <div class="review-text">${escapeHtml(review.review_text)}</div>
                <div class="review-date">${formatDate(review.created_at)}</div>
            `;
            return card;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // --- Load Reviews ---
        let offset = 0;
        const LIMIT = 20;
        let isLoading = false;
        let hasMore = true;

        async function loadReviews(reset = false) {
            if (isLoading || (!hasMore && !reset)) return;
            isLoading = true;

            if (reset) {
                offset = 0;
                hasMore = true;
                animDelay = 0;
                document.getElementById('reviews-container').innerHTML = '<div class="loader-wrap"><div class="spinner"></div></div>';
            }

            try {
                const res = await fetch(`/api/reviews?limit=${LIMIT}&offset=${offset}`);
                const data = await res.json();

                const container = document.getElementById('reviews-container');

                if (reset) container.innerHTML = '';

                const reviews = data.reviews || [];
                const total = data.total || 0;

                // Stats
                if (data.stats) {
                    document.getElementById('stat-total').textContent = data.stats.total || 0;
                    document.getElementById('stat-rating').textContent = (data.stats.avg_rating || 5).toFixed(1);
                    document.getElementById('stat-verified').textContent = data.stats.total || 0;
                    document.getElementById('stats-bar').style.display = 'flex';
                }

                if (reviews.length === 0 && offset === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-title">Пока нет отзывов</div>
                            <div class="empty-state-desc">Станьте первым, кто оставит отзыв о сервисе после аренды!</div>
                        </div>`;
                    isLoading = false;
                    return;
                }

                if (reset) {
                    container.innerHTML = '<div class="section-title">💬 Отзывы клиентов</div>';
                }

                // Remove old load-more button
                const oldBtn = container.querySelector('.load-more-btn');
                if (oldBtn) oldBtn.remove();

                reviews.forEach(r => container.appendChild(renderReview(r)));
                offset += reviews.length;

                if (offset < total) {
                    const btn = document.createElement('button');
                    btn.className = 'load-more-btn';
                    btn.textContent = `Загрузить ещё (${total - offset})`;
                    btn.onclick = () => loadReviews(false);
                    container.appendChild(btn);
                    hasMore = true;
                } else {
                    hasMore = false;
                }

            } catch (e) {
                console.error('Reviews load error:', e);
                document.getElementById('reviews-container').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-title">Ошибка загрузки</div>
                        <div class="empty-state-desc">Не удалось загрузить отзывы. Попробуйте обновить страницу.</div>
                    </div>`;
            }
            isLoading = false;
        }

        // Initial load
        loadReviews(true);
    </script>
</body>
</html>
