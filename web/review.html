<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OctoRent — Отзывы</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #0088cc;
            --accent-blue-glow: rgba(0, 136, 204, 0.4);
            --bg-dark: #000000;
            --card-bg: rgba(20, 20, 22, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent-green: #26D07C;
            --glass-border: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overscroll-behavior: none;
            padding-bottom: 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* PREMIUM MESH BACKGROUND */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 0% 0%, rgba(0, 136, 204, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 100% 30%, rgba(0, 136, 204, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 136, 204, 0.1) 0%, transparent 50%);
            z-index: -2;
        }

        /* GRAIN TEXTURE */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
        }

        /* HEADER */
        .page-header {
            padding: 45px 24px 10px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, var(--bg-dark) 60%, transparent);
        }

        .page-header h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* FILTERS */
        .review-filters {
            display: flex;
            gap: 12px;
            padding: 15px 24px 25px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .review-filters::-webkit-scrollbar { display: none; }

        .review-chip {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 12px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .review-chip.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 20px var(--accent-blue-glow);
            transform: scale(1.05);
        }

        .rev-count {
            margin-left: 6px;
            opacity: 0.4;
            font-weight: 500;
        }

        /* LIST */
        .reviews-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .review-item-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid var(--glass-border);
            position: relative;
            animation: cardEntrance 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .review-item-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .review-nft-thumb-container {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .review-nft-thumb-container::after {
            content: '';
            position: absolute;
            inset: -5px;
            background: var(--accent-blue);
            filter: blur(15px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }

        .review-nft-thumb {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .review-info {
            flex: 1;
            min-width: 0;
        }

        .review-nft-name {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .review-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .review-badge.good {
            background: rgba(38, 208, 124, 0.1);
            color: var(--accent-green);
        }

        .review-badge.bad {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
        }

        .review-content {
            font-size: 19px;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .review-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .review-user-id {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.03);
            padding: 4px 10px;
            border-radius: 10px;
        }

        .v-check {
            width: 14px;
            height: 14px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            color: #fff;
        }

        .review-date {
            font-size: 12px;
            font-weight: 700;
            color: rgba(139, 155, 180, 0.4);
        }

        /* LOADER */
        .loader-wrap { display: flex; justify-content: center; padding: 100px; }
        .premium-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(0, 136, 204, 0.05);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 150px 40px;
            color: var(--text-secondary);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Отзывы</h1>
    </div>

    <div class="review-filters">
        <button class="review-chip active" onclick="setFilter('all')" id="rev-filter-all">
            Все <span class="rev-count" id="rev-count-all">0</span>
        </button>
        <button class="review-chip" onclick="setFilter('positive')" id="rev-filter-positive">
            Довольны <span class="rev-count" id="rev-count-positive">0</span>
        </button>
        <button class="review-chip" onclick="setFilter('negative')" id="rev-filter-negative">
            Критика <span class="rev-count" id="rev-count-negative">0</span>
        </button>
    </div>

    <div id="reviews-list-items" class="reviews-list">
        <div class="loader-wrap"><div class="premium-spinner"></div></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { 
            tg.expand(); 
            tg.setHeaderColor('#000000');
            tg.BackButton.show();
            tg.BackButton.onClick(() => tg.close());
        }

        let currentFilter = 'all';
        let allReviews = [];

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.review-chip').forEach(chip => {
                chip.classList.toggle('active', chip.id === `rev-filter-${filter}`);
            });
            renderReviews();
            if (tg) tg.HapticFeedback.impactOccurred('medium');
        }

        function getGiftImageUrl(name) {
            const numMatch = name?.match(/#(\d+)$/);
            if (!numMatch) return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'G')}&background=1c1c1e&color=fff&size=128&bold=true`;
            const rawName = name.replace(/#\d+$/, '').trim();
            const num = numMatch[1];
            let slug = rawName.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-');
            return `https://nft.fragment.com/gift/${slug}-${num}.webp`;
        }

        function handleImgError(img, name) {
            if (!img.dataset.attempt) {
                img.dataset.attempt = '1';
                const rawName = name.replace(/#\d+$/, '').trim();
                const num = name.match(/#(\d+)$/)[1];
                let slug = rawName.toLowerCase().replace(/[^a-z0-9]/g, '');
                img.src = `https://nft.fragment.com/gift/${slug}-${num}.webp`;
                return;
            }
            if (img.dataset.attempt === '1') {
                img.dataset.attempt = '2';
                const rawName = name.replace(/#\d+$/, '').trim();
                let folder = rawName.toLowerCase().replace(/[^a-z0-9]/g, '') + 's';
                img.src = `/file/gifts/${folder}/thumb.webp`;
                return;
            }
            img.onerror = null;
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'G')}&background=1c1c1e&color=fff&size=128&bold=true`;
        }

        async function loadData() {
            try {
                const res = await fetch('./api/reviews?limit=100&offset=0');
                const data = await res.json();
                allReviews = data.reviews || [];
                document.getElementById('rev-count-all').innerText = allReviews.length;
                document.getElementById('rev-count-positive').innerText = allReviews.filter(r => (r.rating || 5) >= 4).length;
                document.getElementById('rev-count-negative').innerText = allReviews.filter(r => (r.rating || 5) < 4).length;
                renderReviews();
            } catch (e) {
                console.error(e);
                document.getElementById('reviews-list-items').innerHTML = '<div class="empty-state">Упс! Не удалось загрузить данные</div>';
            }
        }

        function renderReviews() {
            const container = document.getElementById('reviews-list-items');
            let filtered = allReviews;
            if (currentFilter === 'positive') filtered = allReviews.filter(r => (r.rating || 5) >= 4);
            else if (currentFilter === 'negative') filtered = allReviews.filter(r => (r.rating || 5) < 4);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Пока нет таких отзывов</div>';
                return;
            }

            container.innerHTML = filtered.map((r, i) => `
                <div class="review-item-card" style="animation-delay: ${i * 0.1}s">
                    <div class="review-item-header">
                        <div class="review-nft-thumb-container">
                            <img src="${getGiftImageUrl(r.nft_name)}" onerror="handleImgError(this, '${(r.nft_name || '').replace(/'/g, "\\'")}')" class="review-nft-thumb">
                        </div>
                        <div class="review-info">
                            <div class="review-nft-name">${r.nft_name || 'Fragment Gift'}</div>
                            <div class="review-badge ${(r.rating || 5) >= 4 ? 'good' : 'bad'}">
                                ${(r.rating || 5) >= 4 ? '✓ Доволен' : '⚠ Есть нюансы'}
                            </div>
                        </div>
                    </div>
                    <div class="review-content">${escapeHtml(r.review_text)}</div>
                    <div class="review-item-footer">
                        <div class="review-user-id">
                            ID: ${String(r.user_id || '00000').slice(-6)}
                            <div class="v-check">✓</div>
                        </div>
                        <div class="review-date">${formatDate(r.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
                return `${d.getDate()} ${months[d.getMonth()]}`;
            } catch { return "недавно"; }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        loadData();
    </script>
</body>
</html>
