<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OctoRent — Отзывы</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #0088cc;
            --bg-dark: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent-green: #26D07C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overscroll-behavior: none;
            padding-bottom: 40px;
        }

        /* HEADER */
        .page-header {
            padding: 20px 20px 10px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }

        /* FILTERS */
        .review-filters {
            display: flex;
            gap: 8px;
            padding: 16px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .review-filters::-webkit-scrollbar {
            display: none;
        }

        .review-chip {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        /* ACTIVE BLUE STYLE */
        .review-chip.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .rev-count {
            opacity: 0.5;
            font-size: 12px;
        }

        .review-chip.active .rev-count {
            opacity: 0.9;
            color: #fff;
        }

        .rev-count.positive {
            color: var(--accent-green);
        }

        .review-chip.active .rev-count.positive {
            color: #fff;
        }

        /* LIST */
        .reviews-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item-card {
            background: linear-gradient(145deg, #161618, #1c1c1e);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(0, 136, 204, 0.25);
            box-shadow: 0 4px 20px rgba(0, 136, 204, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeInUp 0.4s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .review-item-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .review-nft-thumb {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: #2c2c2e;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .review-info {
            flex: 1;
            min-width: 0;
        }

        .review-nft-name {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .review-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .review-badge.good {
            background: rgba(38, 208, 124, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(38, 208, 124, 0.2);
        }

        .review-badge.bad {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .review-content {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
            word-break: break-word;
        }

        .review-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .review-user-id {
            font-size: 13px;
            font-weight: 700;
            color: #4c4c4e;
        }

        .review-date {
            font-size: 13px;
            font-weight: 700;
            color: #4c4c4e;
        }

        /* LOADERS */
        .loader-wrap {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .premium-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 136, 204, 0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Все отзывы</h1>
    </div>

    <div class="review-filters">
        <button class="review-chip active" onclick="setFilter('all')" id="rev-filter-all">
            Все отзывы <span class="rev-count" id="rev-count-all">0</span>
        </button>
        <button class="review-chip" onclick="setFilter('positive')" id="rev-filter-positive">
            Позитивные <span class="rev-count positive" id="rev-count-positive">0 100%</span>
        </button>
        <button class="review-chip" onclick="setFilter('negative')" id="rev-filter-negative">
            Негативные <span class="rev-count" id="rev-count-negative">—</span>
        </button>
    </div>

    <div id="reviews-list-items" class="reviews-list">
        <div class="loader-wrap"><div class="premium-spinner"></div></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { 
            tg.expand(); 
            tg.setHeaderColor('#000000');
            tg.BackButton.show();
            tg.BackButton.onClick(() => tg.close());
        }

        let currentFilter = 'all';
        let allReviews = [];

        const SLUG_MAPPING = {
            'artisanbricks': 'artisanbrick', 'berryboxes': 'berrybox', 'happybday': 'b-daycandle',
            'bdaycandle': 'b-daycandle', 'thebackyard': 'alphadogs', 'prettyposies': 'prettyposy',
            'astralshards': 'astralshard', 'poop': 'happybrownie', 'happybrownie': 'happybrownie',
            'kissedfrog': 'kissedfrog', 'plushpepe': 'plushpepe', 'ducks': 'ducks',
            'eternalrose': 'eternalrose', 'cloverpin': 'cloverpin', 'whipcupcake': 'whipcupcake',
            'jellypuppy': 'jellypuppy', 'magicmushroom': 'magicmushroom', 'goldstar': 'goldstar',
            'khabibspapakha': 'khabibspapakha'
        };

        function getGiftImageUrl(name) {
            if (!name) return `https://ui-avatars.com/api/?name=NFT&background=2c2c2e&color=fff&size=48&bold=true&rounded=true`;
            const match = name.match(/^(.*?)\s*#(\d+)$/);
            if (!match) return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2c2c2e&color=fff&size=48&bold=true&rounded=true`;

            const rawName = match[1].trim();
            const num = match[2];
            const lookupKey = rawName.toLowerCase().replace(/[^a-z0-9]/g, '');
            let slug = SLUG_MAPPING[lookupKey] || lookupKey;
            
            // For items like "scared cat" -> "scared-cat" if concatenated doesn't work, we'll try hyphenated via onerror,
            // but Fragment usually uses hyphenated for newer collections, so let's try hyphenated first for non-mapped.
            if (!SLUG_MAPPING[lookupKey] && rawName.includes(' ')) {
                slug = rawName.toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-');
            }

            return `https://nft.fragment.com/gift/${slug}-${num}.webp`;
        }

        function handleImgError(img, fallbackName) {
            if (!img.dataset.failedOnce) {
                img.dataset.failedOnce = 'true';
                // Try without hyphens
                const lookupKey = fallbackName.replace(/#\d+$/, '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                const num = fallbackName.match(/#(\d+)$/) ? fallbackName.match(/#(\d+)$/)[1] : '';
                if (num) {
                    img.src = `https://nft.fragment.com/gift/${lookupKey}-${num}.webp`;
                    return;
                }
            }
            img.onerror = null;
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fallbackName || 'NFT')}&background=2c2c2e&color=fff&size=48&bold=true&rounded=true`;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.review-chip').forEach(chip => {
                chip.classList.toggle('active', chip.id === `rev-filter-${filter}`);
            });
            renderReviews();
        }

        async function loadData() {
            try {
                // Using relative path for better compatibility with server
                const res = await fetch('./api/reviews?limit=100&offset=0');
                const data = await res.json();
                allReviews = data.reviews || [];
                
                const stats = data.stats || {};
                const total = stats.total || allReviews.length;
                document.getElementById('rev-count-all').innerText = total;
                document.getElementById('rev-count-positive').innerText = `${total} 100%`;
                
                renderReviews();
            } catch (e) {
                console.error(e);
                document.getElementById('reviews-list-items').innerHTML = '<div class="empty-state">Нет отзывов</div>';
            }
        }

        function renderReviews() {
            const container = document.getElementById('reviews-list-items');
            let filtered = allReviews;
            
            if (currentFilter === 'positive') filtered = allReviews.filter(r => (r.rating || 5) >= 4);
            else if (currentFilter === 'negative') filtered = allReviews.filter(r => (r.rating || 5) < 4);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет отзывов</div>';
                return;
            }

            container.innerHTML = filtered.map((r, i) => `
                <div class="review-item-card" style="animation-delay: ${i * 50}ms">
                    <div class="review-item-header">
                        <img src="${getGiftImageUrl(r.nft_name)}" onerror="handleImgError(this, '${(r.nft_name || 'GIFT').replace(/'/g, "\\'")}')" class="review-nft-thumb">
                        <div class="review-info">
                            <div class="review-nft-name">${r.nft_name || 'GIFT'}</div>
                            <div class="review-badge ${(r.rating || 5) >= 4 ? 'good' : 'bad'}">
                                ${(r.rating || 5) >= 4 ? '✓ ХОРОШО' : '⚠ ТАК СЕБЕ'}
                            </div>
                        </div>
                    </div>
                    <div class="review-content">${escapeHtml(r.review_text)}</div>
                    <div class="review-item-footer">
                        <div class="review-user-id">#${String(r.user_id || '00000').slice(-5)}</div>
                        <div class="review-date">${formatDate(r.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                const months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
                return `${d.getDate()} ${months[d.getMonth()]}`;
            } catch { return "недавно"; }
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        loadData();
    </script>
</body>
</html>
